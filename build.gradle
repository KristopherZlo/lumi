def configureNoLumiClientGameTest = { String taskName, String sourceSetName ->
    tasks.named(taskName).configure {
        def devSourceSets = ['main', 'client', 'gametest', 'baselineGametest', 'idleGametest', 'baselineIdleGametest', 'historyJourneyGametest']
        def excludedGroups = devSourceSets.findAll { it != sourceSetName }.collectMany { name ->
            ["/build/classes/java/${name}", "/build/resources/${name}"]
        }

        classpath = classpath.filter { file ->
            def path = file.absolutePath.replace('\\', '/')
            !excludedGroups.any { path.endsWith(it) }
        }

        doFirst {
            def launchConfig = layout.projectDirectory.file('.gradle/loom-cache/launch.cfg').asFile
            if (!launchConfig.exists()) {
                throw new GradleException("Missing Loom launch config: ${launchConfig}")
            }

            def sourceGroup = [
                    layout.buildDirectory.dir("classes/java/${sourceSetName}").get().asFile.absolutePath,
                    layout.buildDirectory.dir("resources/${sourceSetName}").get().asFile.absolutePath
            ].join(';')

            def lines = launchConfig.readLines('UTF-8').collect { line ->
                if (!line.trim().startsWith('fabric.classPathGroups=')) {
                    return line
                }

                def prefix = line.takeWhile { it == '\t' || it == ' ' }
                def value = line.trim().substring('fabric.classPathGroups='.length())
                def groups = value.split(';;') as List<String>
                def keptGroups = groups.findAll { group ->
                    def normalized = group.replace('\\', '/')
                    !excludedGroups.any { normalized.contains(it) }
                }
                return prefix + 'fabric.classPathGroups=' + ([sourceGroup] + keptGroups).join(';;')
            }
            launchConfig.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }
}

