import groovy.json.JsonOutput
import io.github.lumi.buildconfig.MinecraftTargetCatalogReader

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

def minecraftTargetsFile = file('gradle/minecraft-targets.json')
def minecraftTargets = new MinecraftTargetCatalogReader().read(minecraftTargetsFile.toPath())
def minecraftTarget = minecraftTargets.select(
        providers.gradleProperty('lumiTarget').getOrElse(minecraftTargets.defaultTarget().id()))
ext.lumiMinecraftTarget = minecraftTarget
if (minecraftTarget.javaVersion() != 21) {
    throw new GradleException("Use the isolated modern build: gradlew -p modern :adapters:${minecraftTarget.id()}:build")
}
ext.lumiRemapJarTaskType = net.fabricmc.loom.task.RemapJarTask
ext.lumiServerProductionRunTaskType = net.fabricmc.loom.task.prod.ServerProductionRunTask
ext.lumiClientProductionRunTaskType = net.fabricmc.loom.task.prod.ClientProductionRunTask
def obsoleteTargetProperties = ['minecraft_version', 'loader_version', 'fabric_api_version',
        'worldedit_version_id', 'axiom_version_id']
obsoleteTargetProperties.each { name ->
    if (providers.gradleProperty(name).isPresent()) {
        throw new GradleException("${name} belongs in gradle/minecraft-targets.json; select a group with -PlumiTarget")
    }
}

version = project.mod_version
def modVersion = project.version.toString()
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${minecraftTarget.minecraftVersion()}"
}

tasks.register('listMinecraftTargets') {
    group = 'help'
    description = 'Lists the configured artifact groups and their exact game releases'
    doLast {
        minecraftTargets.targets().each { target ->
            logger.lifecycle("${target.id()}: ${target.minecraftVersions().join(', ')} (Java ${target.javaVersion()})")
        }
    }
}

apply from: 'gradle/artifact-manifest.gradle'

loom {
    accessWidenerPath = file('src/main/resources/lumi.accesswidener')
}

repositories {
    mavenCentral()
    maven {
        name = 'EngineHub'
        url = 'https://maven.enginehub.org/repo/'
        content { includeGroup 'org.enginehub.worldeditcui-protocol' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    axiomDistribution
}

def axiomRuntimeDirectory = layout.buildDirectory.dir('axiom-runtime')
def unpackAxiomRuntime = tasks.register('unpackAxiomRuntime', Copy) {
    from({ zipTree(configurations.axiomDistribution.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { file -> file.path = file.name }
        includeEmptyDirs = false
    }
    into axiomRuntimeDirectory
}

def axiomRuntimeJars = files(
        axiomRuntimeDirectory.map { directory ->
            minecraftTarget.axiomRuntimeJars().collect { name -> directory.file(name).asFile }
        }
).builtBy(unpackAxiomRuntime)

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "lumi-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

tasks.named('runGameTest') {
    doFirst {
        delete(layout.buildDirectory.dir('run/gameTest/world'))
    }
    def filter = System.getProperty('fabric-api.gametest.filter')
    if (filter != null && !filter.isBlank()) {
        systemProperty 'fabric-api.gametest.filter', filter
    }
}

tasks.named('runClientGameTest') {
    systemProperty 'fabric.client.gametest.disableNetworkSynchronizer', 'true'
    System.properties.findAll { name, ignored ->
        name.toString().startsWith('lumi.benchmark.')
                || name == 'lumi.gametest.operationTimeoutTicks'
                || name == 'lumi.gametest.firstMinuteOnly'
                || name == 'lumi.gametest.suite'
                || name.toString().startsWith('lumi.gametest.restoreCrash')
                || name.toString().startsWith('lumi.gametest.upgrade.')
                || name.toString().startsWith('lumi.multiplayer.')
    }.each { name, value -> systemProperty name.toString(), value }
    if (System.getProperty('lumi.gametest.restoreCrashMode') == 'produce') {
        ignoreExitValue = true
        doLast {
            def marker = file(System.getProperty(
                    'lumi.gametest.restoreCrashMarker', ''))
            if (!marker.isFile()) {
                throw new GradleException('Restore crash cutpoint was not reached')
            }
        }
    }
    def benchmarkHeap = System.getProperty('lumi.benchmark.heap')
    if (benchmarkHeap != null && !benchmarkHeap.isBlank()) {
        jvmArgs "-Xmx${benchmarkHeap}"
    }
    def existingWorldSource =
            System.getProperty('lumi.benchmark.existingWorldSource')
    if (existingWorldSource != null && !existingWorldSource.isBlank()) {
        def existingWorldName =
                System.getProperty('lumi.benchmark.existingWorld')
        if (existingWorldName == null || existingWorldName.isBlank()
                || existingWorldName == '.' || existingWorldName == '..'
                || new File(existingWorldName).name != existingWorldName) {
            throw new GradleException(
                    'lumi.benchmark.existingWorld must be one save-folder name')
        }
        doFirst {
            def source = file(existingWorldSource)
            if (!source.isDirectory()) {
                throw new GradleException(
                        "Existing benchmark world does not exist: ${source}")
            }
            copy {
                from source
                exclude 'session.lock'
                into layout.buildDirectory.dir(
                        "run/clientGameTest/saves/${existingWorldName}")
            }
        }
    }
}

tasks.named('deleteGameTestRunDir') {
    onlyIf { System.getProperty('lumi.gametest.restoreCrashMode') != 'verify' }
}

apply from: 'gradle/client-verification.gradle'

def restoreCrashPhases = ['prepared', 'applying', 'write', 'barrier', 'force', 'verify', 'publication', 'cleanup']
def restoreCrashVerifiers = []
def previousRestoreCrashVerifier = null
restoreCrashPhases.each { phase ->
    def suffix = phase.capitalize()
    def marker = layout.buildDirectory.file(
            "reports/lumi-crash-matrix/${phase}.marker").get().asFile
    def launcher = file(System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'gradlew.bat' : 'gradlew')
    def predecessor = previousRestoreCrashVerifier
    def producer = tasks.register("runRestoreCrash${suffix}Producer", Exec) {
        group = 'verification'
        description = "Crashes a Minecraft process after Restore ${phase}"
        if (predecessor != null) {
            mustRunAfter(predecessor)
        }
        doFirst {
            delete(layout.buildDirectory.dir('run/clientGameTest'))
            delete(marker)
        }
        commandLine launcher,
                '-Dlumi.gametest.suite=RESTORE_CRASH',
                '-Dlumi.gametest.restoreCrashMode=produce',
                "-Dlumi.gametest.restoreCrashPhase=${phase}",
                "-Dlumi.gametest.restoreCrashMarker=${marker.absolutePath}",
                'runClientGameTest', '--no-daemon'
    }
    def verifier = tasks.register("runRestoreCrash${suffix}Verifier", Exec) {
        group = 'verification'
        description = "Recovers and reopens the Restore ${phase} crash world"
        dependsOn(producer)
        commandLine launcher,
                '-Dlumi.gametest.suite=RESTORE_CRASH',
                '-Dlumi.gametest.restoreCrashMode=verify',
                "-Dlumi.gametest.restoreCrashExpectedPhase=${phase}",
                'runClientGameTest', '--no-daemon'
    }
    restoreCrashVerifiers.add(verifier)
    previousRestoreCrashVerifier = verifier
}

tasks.register('runRestoreCrashMatrix') {
    group = 'verification'
    description = 'Runs real process crashes at Restore persistence cutpoints'
    dependsOn(restoreCrashVerifiers)
}

dependencies {
    implementation project(':core')
    include project(':core')
    axiomDistribution "maven.modrinth:N6n5dqoA:${minecraftTarget.axiomVersionId()}"
    minecraft "com.mojang:minecraft:${minecraftTarget.minecraftVersion()}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${minecraftTarget.loaderVersion()}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${minecraftTarget.fabricApiVersion()}"
    modCompileOnly "maven.modrinth:1u6JkXh5:${minecraftTarget.worldeditVersionId()}"
    modCompileOnly "maven.modrinth:N6n5dqoA:${minecraftTarget.axiomVersionId()}"
    compileOnly axiomRuntimeJars
    modRuntimeOnly "maven.modrinth:1u6JkXh5:${minecraftTarget.worldeditVersionId()}"
    modRuntimeOnly "maven.modrinth:N6n5dqoA:${minecraftTarget.axiomVersionId()}"
    runtimeOnly axiomRuntimeJars
    minecraftTarget.worldeditCuiCoordinate().ifPresent { coordinate -> modRuntimeOnly coordinate }

    implementation "at.yawk.lz4:lz4-java:${project.lz4_version}"
    include "at.yawk.lz4:lz4-java:${project.lz4_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.properties(
            version: project.version,
            minecraft_versions: JsonOutput.toJson(minecraftTarget.minecraftVersions()),
            java_version: minecraftTarget.javaVersion(),
            loader_version: minecraftTarget.loaderVersion(),
            fabric_api_version: minecraftTarget.fabricApiVersion()
    )
    inputs.file(minecraftTargetsFile)
    filesMatching(['fabric.mod.json', 'lumi.mixins.json']) {
        if (name == 'fabric.mod.json') {
            // Loom reads the unexpanded template as JSON.
            filter { line -> line.replace('"${minecraft_versions}"',
                    JsonOutput.toJson(minecraftTarget.minecraftVersions())) }
        }
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = minecraftTarget.javaVersion()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('test', Test) {
    dependsOn ':core:test'
    useJUnitPlatform { excludeTags 'performance' }
    systemProperty 'lumi.test.target', minecraftTarget.id()
}

gradle.projectsEvaluated {
    tasks.named('test', Test) {
        def productionProjects = rootProject.allprojects.findAll { it.plugins.hasPlugin('java') }
        ['java', 'resources'].each { kind ->
            def roots = productionProjects.collectMany { it.sourceSets.main[kind].srcDirs }
                    .findAll { it.exists() }.collect { it.absolutePath }.unique()
            systemProperty "lumi.test.production.${kind}", roots.join(File.pathSeparator)
        }
    }
}

tasks.register('regressionPerformanceTest', Test) {
    description = 'Measures idle polling, origin durability, native palette capture and overlapping zone shells.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'performance' }
    systemProperty 'lumi.regression.reportDir',
            layout.buildDirectory.dir('reports/lumi-regressions').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(minecraftTarget.javaVersion())
    sourceCompatibility = JavaVersion.toVersion(minecraftTarget.javaVersion())
    targetCompatibility = JavaVersion.toVersion(minecraftTarget.javaVersion())
    withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
    from(project(':core').sourceSets.main.allSource)
}

apply from: 'gradle/packaged-verification.gradle'
