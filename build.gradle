def downloadPinnedTestClientMods = tasks.register('downloadPinnedTestClientMods') {
    def outputDir = layout.buildDirectory.dir('test-client-downloads')
    inputs.property('includeFullTestClientStack', includeFullTestClientStack)
    inputs.property('pinnedTestClientModFiles', pinnedTestClientModFiles)
    inputs.property('pinnedFullStackTestClientModFiles', pinnedFullStackTestClientModFiles)
    outputs.dir(outputDir)

    doLast {
        def targetDir = outputDir.get().asFile
        if (targetDir.exists()) {
            delete(targetDir.listFiles())
        }
        targetDir.mkdirs()

        def pinnedFiles = pinnedTestClientModFiles
        if (includeFullTestClientStack.get()) {
            pinnedFiles += pinnedFullStackTestClientModFiles
        }

        pinnedFiles.each { fileName, url ->
            def outputFile = new File(targetDir, fileName)
            ant.get(src: url, dest: outputFile, skipexisting: false)
        }
    }
}

