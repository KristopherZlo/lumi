def writeQuietClientRuntimeOptions = { String runDirPath ->
    File optionsFile = layout.projectDirectory.file("${runDirPath}/options.txt").asFile
    optionsFile.parentFile.mkdirs()

    List<String> existingLines = optionsFile.exists() ? optionsFile.readLines('UTF-8') : []
    Map<String, String> updatedValues = [:]

    existingLines.each { line ->
        int separatorIndex = line.indexOf(':')
        if (separatorIndex <= 0) {
            return
        }
        updatedValues[line.substring(0, separatorIndex)] = line.substring(separatorIndex + 1)
    }
    quietClientRuntimeOptions.each { key, value ->
        updatedValues[key] = value
    }

    List<String> rewrittenLines = []
    Set<String> rewrittenKeys = new LinkedHashSet<>()
    existingLines.each { line ->
        int separatorIndex = line.indexOf(':')
        if (separatorIndex <= 0) {
            rewrittenLines.add(line)
            return
        }
        String key = line.substring(0, separatorIndex)
        rewrittenLines.add("${key}:${updatedValues[key]}")
        rewrittenKeys.add(key)
    }
    quietClientRuntimeOptions.each { key, value ->
        if (!rewrittenKeys.contains(key)) {
            rewrittenLines.add("${key}:${value}")
        }
    }

    if (rewrittenLines.isEmpty()) {
        quietClientRuntimeOptions.each { key, value ->
            rewrittenLines.add("${key}:${value}")
        }
    }

    optionsFile.setText(rewrittenLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
}

