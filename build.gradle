plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file('src/main/resources/lumi.accesswidener')
}

repositories {
    mavenCentral()
    maven {
        name = 'EngineHub'
        url = 'https://maven.enginehub.org/repo/'
        content { includeGroup 'org.enginehub.worldeditcui-protocol' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    axiomDistribution
}

def axiomRuntimeDirectory = layout.buildDirectory.dir('axiom-runtime')
def unpackAxiomRuntime = tasks.register('unpackAxiomRuntime', Copy) {
    from({ zipTree(configurations.axiomDistribution.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { file -> file.path = file.name }
        includeEmptyDirs = false
    }
    into axiomRuntimeDirectory
}

def axiomRuntimeJars = files(
        axiomRuntimeDirectory.map { directory -> [
                directory.file('axiomclientapi.jar').asFile,
                directory.file('lattice-1.3.0.jar').asFile,
                directory.file('mixinconstraints-1.0.9.jar').asFile,
                directory.file('mixinextras-fabric-0.3.5.jar').asFile
        ] }
).builtBy(unpackAxiomRuntime)

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "lumi-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

tasks.named('runGameTest') {
    doFirst {
        delete(layout.buildDirectory.dir('run/gameTest/world'))
    }
}

dependencies {
    axiomDistribution "maven.modrinth:N6n5dqoA:${project.axiom_version_id}"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "maven.modrinth:1u6JkXh5:${project.worldedit_version_id}"
    modCompileOnly "maven.modrinth:N6n5dqoA:${project.axiom_version_id}"
    compileOnly axiomRuntimeJars
    modRuntimeOnly "maven.modrinth:1u6JkXh5:${project.worldedit_version_id}"
    modRuntimeOnly "maven.modrinth:N6n5dqoA:${project.axiom_version_id}"
    modRuntimeOnly "org.enginehub.worldeditcui-protocol:" +
            "worldeditcui-protocol-fabric-mc1.21.11:4.0.2"

    implementation "org.lz4:lz4-java:${project.lz4_version}"
    include "org.lz4:lz4-java:${project.lz4_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.properties(
            version: project.version,
            minecraft_version: project.minecraft_version,
            loader_version: project.loader_version,
            fabric_api_version: project.fabric_api_version
    )
    filesMatching('fabric.mod.json') {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def productionJava = fileTree('src/main/java') {
    include '**/*.java'
}
def coreJava = productionJava.matching {
    include 'io/github/lumi/domain/**'
    include 'io/github/lumi/minecraft/**'
    include 'io/github/lumi/network/**'
    include 'io/github/lumi/storage/**'
}
def countJavaLines = { collection ->
    collection.files.sum { file -> file.readLines('UTF-8').size() } ?: 0
}

def verifyProductionLineBudget = tasks.register('verifyProductionLineBudget') {
    group = 'verification'
    description = 'Enforces Lumi V2 production Java line budgets.'
    inputs.files(productionJava)

    doLast {
        int coreLines = countJavaLines(coreJava)
        int completeLines = countJavaLines(productionJava)
        logger.lifecycle(
                "Lumi production Java lines: core/runtime/storage/network={}, complete={}",
                coreLines, completeLines)
        if (coreLines > 25_000) {
            throw new GradleException(
                    "Core/runtime/storage/network exceeds 25,000 Java lines: ${coreLines}")
        }
        if (completeLines > 50_000) {
            throw new GradleException(
                    "Complete mod exceeds 50,000 Java lines: ${completeLines}")
        }
    }
}

tasks.named('check') {
    dependsOn(verifyProductionLineBudget)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
