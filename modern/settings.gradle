pluginManagement {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; gradlePluginPortal() }
}
plugins { id 'dev.kikugie.stonecutter' version '0.9.8' }

def minecraftTargets = new groovy.json.JsonSlurper().parse(file('../gradle/minecraft-targets.json'))

rootProject.name = 'lumi-modern'
include 'core', 'adapters'
project(':core').projectDir = file('../core')
project(':adapters').projectDir = file('..')

stonecutter {
    create('adapters') {
        centralScript = 'build-modern.gradle'
        kotlinController = false
        minecraftTargets.targets.findAll { it.javaVersion > 21 }.each { target ->
            version(target.id, target.minecraftVersion)
        }
    }
}
