import groovy.json.JsonOutput
import io.github.lumi.buildconfig.MinecraftTargetCatalogReader

plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }

def repositoryRoot = project(':adapters').projectDir
def catalog = new MinecraftTargetCatalogReader().read(
        new File(repositoryRoot, 'gradle/minecraft-targets.json').toPath())
def target = catalog.select(stonecutter.current.project)
def requestedGame = providers.gradleProperty('lumiGameVersion').orNull
if (requestedGame != null && !catalog.targets().any { it.minecraftVersions().contains(requestedGame) }) {
    throw new GradleException("Unknown verification game ${requestedGame}")
}
def verificationGame = requestedGame != null && target.minecraftVersions().contains(requestedGame)
        ? requestedGame : target.minecraftVersion()
ext.lumiVerificationGame = verificationGame
// Every adapter configures together; reject a mismatched launch only on its selected task.
tasks.matching { it.name in ['runClientGameTest', 'runGameTest', 'runPackagedGameTest',
        'runPackagedClientGameTest', 'runVanillaReopenGameTest', 'prepareMultiplayerLaunch'] }.configureEach {
    onlyIf {
        if (requestedGame != null && !target.minecraftVersions().contains(requestedGame)) {
            throw new GradleException("${requestedGame} is outside target ${target.id()}")
        }
        true
    }
}
if (verificationGame != target.minecraftVersion() && !providers.gradleProperty('lumiArtifact').isPresent()) {
    throw new GradleException('Alternate-game verification requires a frozen -PlumiArtifact')
}
ext.lumiMinecraftTarget = target
ext.lumiServerProductionRunTaskType = net.fabricmc.loom.task.prod.ServerProductionRunTask
ext.lumiClientProductionRunTaskType = net.fabricmc.loom.task.prod.ClientProductionRunTask
ext.lumiPreparedClientLaunchType = LumiPreparedClientLaunch
version = rootProject.mod_version
group = rootProject.maven_group
base { archivesName = rootProject.archives_base_name }
loom { accessWidenerPath = file('src/main/resources/lumi.accesswidener') }
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${target.minecraftVersion()}"
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
configurations { axiomDistribution }
def axiomDirectory = layout.buildDirectory.dir('axiom-runtime')
def unpackAxiom = tasks.register('unpackAxiomRuntime', Copy) {
    from({ zipTree(configurations.axiomDistribution.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into axiomDirectory
}
def axiomJars = files(axiomDirectory.map { directory ->
    target.axiomRuntimeJars().collect { directory.file(it).asFile }
}).builtBy(unpackAxiom)

dependencies {
    minecraft "com.mojang:minecraft:${verificationGame}"
    implementation project(':core')
    include project(':core')
    implementation "net.fabricmc:fabric-loader:${target.loaderVersion()}"
    implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApiVersion()}"
    compileOnly "maven.modrinth:1u6JkXh5:${target.worldeditVersionId()}"
    compileOnly "maven.modrinth:N6n5dqoA:${target.axiomVersionId()}"
    axiomDistribution "maven.modrinth:N6n5dqoA:${target.axiomVersionId()}"
    compileOnly axiomJars
    runtimeOnly "maven.modrinth:1u6JkXh5:${target.worldeditVersionId()}"
    runtimeOnly "maven.modrinth:N6n5dqoA:${target.axiomVersionId()}"
    implementation "at.yawk.lz4:lz4-java:${rootProject.lz4_version}"
    include "at.yawk.lz4:lz4-java:${rootProject.lz4_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'lumi-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

tasks.named('runClientGameTest') {
    systemProperty 'fabric.client.gametest.disableNetworkSynchronizer', 'true'
    System.properties.findAll { name, ignored ->
        name.toString().startsWith('lumi.benchmark.') || name.toString().startsWith('lumi.gametest.')
                || name.toString().startsWith('lumi.multiplayer.')
    }.each { name, value -> systemProperty name.toString(), value }
    jvmArgs '-Xmx2G'
}

java { toolchain.languageVersion = JavaLanguageVersion.of(target.javaVersion()); withSourcesJar() }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.javaVersion()
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
tasks.withType(Test).configureEach { useJUnitPlatform { excludeTags 'performance' } }
tasks.register('regressionPerformanceTest', Test) {
    group = 'verification'
    description = 'Runs the shared component regression workloads on the selected native API.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { excludeTags = []; includeTags 'performance' }
    systemProperty 'lumi.regression.reportDir',
            layout.buildDirectory.dir('reports/lumi-regressions').get().asFile.absolutePath
    outputs.upToDateWhen { false }
}

tasks.named('test') {
    dependsOn ':core:test'
    workingDir repositoryRoot
    systemProperty 'lumi.test.target', target.id()
}

gradle.projectsEvaluated {
    tasks.named('test') {
        doFirst {
            ['java', 'resources'].each { kind ->
                def roots = [project, project(':core')]
                        .collectMany { it.sourceSets.main[kind].srcDirs }
                        .findAll { it.exists() }.collect { it.absolutePath }.unique()
                systemProperty "lumi.test.production.${kind}", roots.join(File.pathSeparator)
            }
        }
    }
}

tasks.named('processResources') {
    def parameters = [version: project.version, loader_version: target.loaderVersion(),
            minecraft_versions: JsonOutput.toJson(target.minecraftVersions()),
            java_version: target.javaVersion(), fabric_api_version: target.fabricApiVersion()]
    inputs.properties(parameters)
    inputs.file(new File(repositoryRoot, 'gradle/minecraft-targets.json'))
    filesMatching('fabric.mod.json') {
        filter { it.replace('"${minecraft_versions}"', JsonOutput.toJson(target.minecraftVersions())) }
        expand(parameters)
    }
    filesMatching('lumi.mixins.json') { expand(parameters) }
}

apply from: new File(repositoryRoot, 'gradle/modern-api.gradle')
apply from: new File(repositoryRoot, 'gradle/packaged-verification.gradle')
apply from: new File(repositoryRoot, 'gradle/client-verification.gradle')

abstract class LumiPreparedClientLaunch extends net.fabricmc.loom.task.prod.ClientProductionRunTask {
    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.file.RegularFileProperty getDescriptor()

    @Override @org.gradle.api.tasks.TaskAction
    void run() {
        // Capturing this lazy provider does not launch the configured process.
        project.providers.exec { spec ->
            configureCommand(spec)
            configureJvmArgs(spec)
            configureClasspath(spec)
            configureMainClass(spec)
            configureProgramArgs(spec)
            descriptor.get().asFile.text = groovy.json.JsonOutput.toJson([
                    command: spec.commandLine.collect { it.toString() },
                    mainClass: getMainClass().get(),
                    runDirectory: runDir.get().asFile.absolutePath,
                    mods: mods.files.collect { it.absolutePath }])
        }
    }
}
