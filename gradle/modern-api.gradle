// Mechanical API renames only. Behavioral changes stay beside their native callers.
stonecutter.replacements {
    string(true, 'chunk-position') {
        replace('position.x', 'position.x()')
        replace('position.z', 'position.z()')
    }
    regex(true, 'origin-position') {
        replace('\\borigin\\.([xz])\\b(?!\\()', 'origin.$1()', '\\borigin\\.([xz])\\(\\)', 'origin.$1')
    }
    regex(true, 'test-chunk-position') {
        replace('\\bchunk\\.([xz])\\b(?!\\()', 'chunk.$1()', '\\bchunk\\.([xz])\\(\\)', 'chunk.$1')
    }
    regex(true, '!native-types') {
        replace('\\bGuiGraphics\\b', 'GuiGraphicsExtractor', '\\bGuiGraphicsExtractor\\b', 'GuiGraphics')
        replace('(public void )render(?=\\(\\s*GuiGraphics\\b)', '$1extractRenderState',
                '(public void )extractRenderState(?=\\(\\s*GuiGraphicsExtractor\\b)', '$1render')
        replace('(\\.(?:getPos|chunkPosition)\\(\\))\\.([xz])\\b(?!\\()', '$1.$2()',
                '(\\.(?:getPos|chunkPosition)\\(\\))\\.([xz])\\(\\)', '$1.$2')
    }
    string(true, '!native-api') {
        replace('net.minecraft.client.gui.render.state.', 'net.minecraft.client.renderer.state.gui.')
        replace('net.minecraft.world.level.BlockAndTintGetter', 'net.minecraft.client.renderer.block.BlockAndTintGetter')
        replace('net.minecraft.client.renderer.LightTexture', 'net.minecraft.util.LightCoordsUtil')
        replace('LightTexture.FULL_BRIGHT', 'LightCoordsUtil.FULL_BRIGHT')
        replace('net.minecraft.client.renderer.block.model.BlockModelPart',
                'net.minecraft.client.renderer.block.dispatch.BlockStateModelPart')
        replace('BlockModelPart', 'BlockStateModelPart')
        replace('ServerWorldEvents', 'ServerLevelEvents')
        replace('net.fabricmc.fabric.api.client.keybinding.v1.', 'net.fabricmc.fabric.api.client.keymapping.v1.')
        replace('KeyBindingHelper', 'KeyMappingHelper')
        replace('net.fabricmc.fabric.api.client.rendering.v1.world.', 'net.fabricmc.fabric.api.client.rendering.v1.level.')
        replace('WorldRenderContext', 'LevelRenderContext')
        replace('WorldRenderEvents', 'LevelRenderEvents')
        replace('graphics.drawString(', 'graphics.text(')
        replace('graphics.drawCenteredString(', 'graphics.centeredText(')
        replace('graphics.hLine(', 'graphics.horizontalLine(')
        replace('graphics.vLine(', 'graphics.verticalLine(')
        replace('graphics.drawWordWrap(', 'graphics.textWithWordWrap(')
        replace('graphics.submitEntityRenderState(', 'graphics.entity(')
        replace('.submitGuiElement(', '.addGuiElement(')
        replace('renderContents(', 'extractContents(')
        replace('renderWidget(', 'extractWidgetRenderState(')
        replace('super.render(', 'super.extractRenderState(')
        replace('button.render(', 'button.extractRenderState(')
        replace('scrollbar.render(', 'scrollbar.extractRenderState(')
        replace('background.render(', 'background.extractRenderState(')
        replace('ScreenEvents.afterRender(', 'ScreenEvents.afterExtract(')
        replace('.registerKeyBinding(', '.registerKeyMapping(')
        replace('PayloadTypeRegistry.playC2S()', 'PayloadTypeRegistry.serverboundPlay()')
        replace('PayloadTypeRegistry.playS2C()', 'PayloadTypeRegistry.clientboundPlay()')
        replace('context.worldState()', 'context.levelState()')
        replace('context.consumers()', 'context.bufferSource()')
        replace('context.matrices()', 'context.poseStack()')
        replace('ChunkPos.asLong(', 'ChunkPos.pack(')
        replace('.toLong()', '.pack()')
        replace('.sortOnUpload()', '.translucent()')
        replace('CachedOrthoProjectionMatrixBuffer', 'ProjectionMatrixBuffer')
        replace('method = "renderTooltip"', 'method = "tooltip"')
        replace('@Accessor("renderState")', '@Accessor("guiRenderState")')
        replace('net.minecraft.client.renderer.state.LevelRenderState',
                'net.minecraft.client.renderer.state.level.LevelRenderState')
        replace('.getClientWorld()', stonecutter.eval(stonecutter.current.version, '>=26.2') ? '.getConnection()' : '.getClientLevel()')
        replace('.resizeDisplay()', '.resizeGui()')
        replace('com.sk89q.worldedit.fabric.FabricPermissionsProvider',
                'com.sk89q.worldedit.coremc.CoreMcPermissionsProvider')
        replace('FabricPermissionsProvider', 'CoreMcPermissionsProvider')
        replace('com.sk89q.worldedit.fabric.FabricWorldEdit',
                'com.sk89q.worldedit.fabric.internal.FabricWorldEdit')
        replace('FabricWorldEdit.inst.getPermissionsProvider()',
                'com.sk89q.worldedit.coremc.CoreMcPermissionsProvider.current()')
        replace('FabricWorldEdit.inst.setPermissionsProvider(',
                'com.sk89q.worldedit.coremc.CoreMcPermissionsProvider.setCurrent(')
    }
    if (stonecutter.eval(stonecutter.current.version, '>=26.2')) {
        regex(true, '!native262-screen') {
            replace('(?<![\\w.])(client|minecraft|ticking)\\.screen\\b', '$1.gui.screen()', '(?<![\\w.])(client|minecraft|ticking)\\.gui\\.screen\\(\\)', '$1.screen')
        }
        regex(true, '!native262-current-screen') {
            replace('Minecraft\\.getInstance\\(\\)\\.screen\\b', 'Minecraft.getInstance().gui.screen()', 'Minecraft\\.getInstance\\(\\)\\.gui\\.screen\\(\\)', 'Minecraft.getInstance().screen')
        }
        regex(true, '!native262-set-screen') {
            replace('(?<![\\w.])(client|minecraft)\\.setScreen\\(', '$1.gui.setScreen(', '(?<![\\w.])(client|minecraft)\\.gui\\.setScreen\\(', '$1.setScreen(')
        }
        regex(true, '!native262-current-set-screen') {
            replace('Minecraft\\.getInstance\\(\\)\\.setScreen\\(', 'Minecraft.getInstance().gui.setScreen(', 'Minecraft\\.getInstance\\(\\)\\.gui\\.setScreen\\(', 'Minecraft.getInstance().setScreen(')
        }
        regex(true, '!native262-entity-types') {
            replace('(?<![\\w.])(?:net\\.minecraft\\.world\\.entity\\.)?EntityType\\.(TNT|ITEM|ARMOR_STAND|FALLING_BLOCK|PIG|CHEST_MINECART|ARROW|END_CRYSTAL)\\b',
                    'net.minecraft.world.entity.EntityTypes.$1',
                    'net\\.minecraft\\.world\\.entity\\.EntityTypes\\.(TNT|ITEM|ARMOR_STAND|FALLING_BLOCK|PIG|CHEST_MINECART|ARROW|END_CRYSTAL)\\b',
                    'net.minecraft.world.entity.EntityType.$1')
        }
        regex(true, '!native262-block-entity-types') {
            replace('(?<![\\w.])(?:net\\.minecraft\\.world\\.level\\.block\\.entity\\.)?BlockEntityType\\.(CHEST|DECORATED_POT)\\b',
                    'net.minecraft.world.level.block.entity.BlockEntityTypes.$1',
                    'net\\.minecraft\\.world\\.level\\.block\\.entity\\.BlockEntityTypes\\.(CHEST|DECORATED_POT)\\b',
                    'net.minecraft.world.level.block.entity.BlockEntityType.$1')
        }
        string(true, '!native262-types') {
            ['WHITE', 'ORANGE', 'MAGENTA', 'LIGHT_BLUE', 'YELLOW', 'LIME', 'PINK', 'GRAY',
             'LIGHT_GRAY', 'CYAN', 'PURPLE', 'BLUE', 'BROWN', 'GREEN', 'RED', 'BLACK'].each { color ->
                replace("Blocks.${color}_CONCRETE", "Blocks.CONCRETE.pick(net.minecraft.world.item.DyeColor.${color})")
            }
        }
        string(true, '!native262-api') {
            replace('RenderSystem.getDevice().getRenderer()', 'RenderSystem.getDevice().getDeviceInfo().name()')
            replace('client.getOverlay()', 'client.gui.overlay()')
            replace('client.options.hideGui', 'client.gui.hud.isHidden()')
            replace('client.gui.setOverlayMessage(', 'client.gui.hud.setOverlayMessage(')
            replace('Minecraft.getInstance().getMainRenderTarget()', 'Minecraft.getInstance().gameRenderer.mainRenderTarget()')
            replace('RenderSystem.getModelViewMatrix()', 'RenderSystem.getModelViewMatrixCopy()')
            replace('VertexFormat.Mode', 'com.mojang.blaze3d.PrimitiveTopology')
            replace('type.mode()', 'type.primitiveTopology()')
            replace('pass.setVertexBuffer(0, layer.buffer())', 'pass.setVertexBuffer(0, layer.buffer().slice())')
            // 26.2: indexCount, instanceCount, firstIndex, vertexOffset, firstInstance.
            replace('pass.drawIndexed(0, 0, layer.indexCount(), 1)', 'pass.drawIndexed(layer.indexCount(), 1, 0, 0, 0)')
            replace('color, OptionalInt.empty(), depth', 'color, java.util.Optional.empty(), depth')
            replace('client.gameRenderer.getLighting()', 'client.gameRenderer.lighting()')
            replace('GpuBuffer.MappedView', 'GpuBufferSlice.MappedView')
            replace('encoder.mapBuffer(buffer, true, false)', 'buffer.map(true, false)')
            replace('color.getFormat().pixelSize()', 'color.getFormat().blockSize()')
            replace('.clearColorAndDepthTextures(color, 0, depth, 1.0)', '.clearColorAndDepthTextures(color, new org.joml.Vector4f(0, 0, 0, 0), depth, 0.0)')
            replace('framing.resolution(), true)', 'framing.resolution(), true, com.mojang.blaze3d.GpuFormat.RGBA8_UNORM)')
        }
    }
}
