import groovy.json.JsonOutput
import io.github.lumi.buildconfig.MinecraftArtifactVerifier
import io.github.lumi.buildconfig.PackagedGameTestEvidence
import io.github.lumi.buildconfig.LegacyGameTestAnnotationRepair

def target = lumiMinecraftTarget
def game = project.findProperty('lumiVerificationGame') ?: providers.gradleProperty('lumiGameVersion').getOrElse(target.minecraftVersion())
if (!target.minecraftVersions().contains(game)) {
    throw new GradleException("${game} is outside target ${target.id()}")
}
def suppliedArtifact = providers.gradleProperty('lumiArtifact')
def binary = tasks.named(target.javaVersion() == 21 ? 'remapJar' : 'jar')
def artifact = suppliedArtifact.isPresent() ? files(file(suppliedArtifact.get())) : files(binary)
ext.lumiPackagedArtifact = artifact

def evidence = new PackagedGameTestEvidence()
def candidateVersion = project.version.toString()
def runDirectory = layout.buildDirectory.dir("run/packaged/${target.id()}/${game}/${UUID.randomUUID()}")
def manifest = runDirectory.map { it.file('lumi-evidence.json').asFile }
def finalizeEvidence = tasks.register('finalizePackagedGameTestEvidence') {
    doLast {
        def file = manifest.get()
        if (file.isFile()) {
            def record = new groovy.json.JsonSlurper().parse(file)
            if (record.status == 'running') {
                record.status = 'failed'
                file.text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
            }
        }
    }
}

configurations {
    packagedTestMods { transitive = false }
    packagedGameTestApi { transitive = false }
    packagedClientGameTestApi { transitive = false }
    vanillaReopenMods { transitive = false }
}
dependencies {
    packagedTestMods "net.fabricmc.fabric-api:fabric-api:${target.fabricApiVersion()}"
    packagedGameTestApi fabricApi.module('fabric-gametest-api-v1', target.fabricApiVersion())
    packagedClientGameTestApi fabricApi.module('fabric-client-gametest-api-v1', target.fabricApiVersion())
    vanillaReopenMods "net.fabricmc.fabric-api:fabric-api:${target.fabricApiVersion()}"
    packagedTestMods "maven.modrinth:1u6JkXh5:${target.worldeditVersionId()}"
    packagedTestMods "maven.modrinth:N6n5dqoA:${target.axiomVersionId()}"
    target.worldeditCuiCoordinate().ifPresent { coordinate -> packagedTestMods coordinate }
}

def testApi = configurations.packagedGameTestApi
if (target.javaVersion() == 21) {
    def repairedApi = layout.buildDirectory.file('packaged-test-api/fabric-gametest-api-v1.jar')
    def repairApi = tasks.register('repairLegacyPackagedGameTestApi') {
        inputs.files(configurations.packagedGameTestApi)
        outputs.file(repairedApi)
        doLast {
            new LegacyGameTestAnnotationRepair().repair(
                    configurations.packagedGameTestApi.singleFile.toPath(), repairedApi.get().asFile.toPath())
        }
    }
    testApi = files(repairedApi).builtBy(repairApi)
}

def testJar = tasks.register('packagedGameTestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = target.javaVersion() == 21 ? 'gametest-dev' : 'gametest'
}
def productionTestJar = testJar
if (target.javaVersion() == 21) {
    productionTestJar = tasks.register('remapPackagedGameTestJar', lumiRemapJarTaskType) {
        inputFile = testJar.flatMap { it.archiveFile }
        archiveClassifier = 'gametest'
        addNestedDependencies = false
    }
}

tasks.register('runPackagedGameTest', lumiServerProductionRunTaskType) {
    finalizedBy finalizeEvidence
    group = 'verification'
    description = 'Runs the supplied Lumi JAR through a normal Fabric dedicated-server launcher'
    installerVersion = '1.1.1'
    loaderVersion = target.loaderVersion()
    minecraftVersion = game
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(target.javaVersion())
    }
    runDir = runDirectory
    mods.setFrom(artifact, configurations.packagedTestMods, testApi, productionTestJar)
    jvmArgs.add('-Dfabric-api.gametest')
    def xmlReport = runDirectory.map { it.file('gametest-results.xml').asFile }
    jvmArgs.add(xmlReport.map { "-Dfabric-api.gametest.report-file=${it.absolutePath}" })
    def testPosition = System.getProperty('lumi.gametest.position')
    if (testPosition != null) jvmArgs.add("-Dlumi.gametest.position=${testPosition}")
    def filter = System.getProperty('fabric-api.gametest.filter')
    if (filter != null) jvmArgs.add("-Dfabric-api.gametest.filter=${filter}")
    def record = [:]
    doFirst {
        def candidate = artifact.singleFile
        new MinecraftArtifactVerifier().verify(candidate.toPath(), target, candidateVersion)
        def directory = runDirectory.get().asFile
        def warmCache = directory.parentFile.listFiles()?.findAll { previous ->
            def report = new File(previous, 'lumi-evidence.json')
            previous != directory && report.isFile() && new groovy.json.JsonSlurper().parse(report).game == game
        }?.max { previous -> previous.lastModified() }
        if (warmCache != null) {
            // Only vanilla bundler caches; Minecraft checks their hashes. Worlds and mods stay isolated.
            ['libraries', 'versions'].each { name ->
                copy { from new File(warmCache, name); into new File(directory, name) }
            }
        }
        record.putAll([schema: 1, status: 'running', group: target.id(), game: game,
                scope: 'server-gametest', filter: filter ?: '*', testPosition: testPosition,
                javaVersion: target.javaVersion(),
                testApi: [originalSha256: evidence.hash(configurations.packagedGameTestApi.singleFile.toPath()),
                        enumDefaultRepair: target.javaVersion() == 21],
                artifact: [path: candidate.absolutePath, sha256: evidence.hash(candidate.toPath())],
                mods: mods.files.collect { mod ->
                    if (!mod.isFile() || !mod.name.endsWith('.jar')) throw new GradleException("Non-JAR production mod: ${mod}")
                    [name: mod.name, sha256: evidence.hash(mod.toPath())]
                }])
        def output = manifest.get()
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
    }
    doLast {
        record.tests = evidence.verify(xmlReport.get().toPath(), artifact.singleFile.toPath(), record.artifact.sha256)
        record.status = 'passed'
        manifest.get().text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
        logger.lifecycle("Packaged ${game}: ${record.tests} passed; evidence: ${manifest.get()}")
    }
}

def clientSuite = System.getProperty('lumi.gametest.suite', 'SMOKE').toUpperCase(Locale.ROOT)
def clientDirectory = layout.buildDirectory.dir("run/packaged-client/${target.id()}/${game}/${UUID.randomUUID()}")
def clientManifest = clientDirectory.map { it.file('lumi-evidence.json').asFile }
def finalizeClient = tasks.register('finalizePackagedClientGameTestEvidence') {
    doLast {
        def file = clientManifest.get()
        if (file.isFile()) {
            def record = new groovy.json.JsonSlurper().parse(file)
            if (record.status == 'running') {
                record.status = 'failed'
                file.text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
            }
        }
    }
}

tasks.register('runPackagedClientGameTest', lumiClientProductionRunTaskType) {
    finalizedBy finalizeClient
    group = 'verification'
    description = 'Runs the distributable JAR through the production client launcher and certifies its loaded origin'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.javaVersion()) }
    runDir = clientDirectory
    mods.setFrom(artifact, configurations.packagedTestMods, testApi, configurations.packagedClientGameTestApi, productionTestJar)
    jvmArgs.addAll('-Xmx2G', '-Dfabric.client.gametest', '-Dfabric.client.gametest.disableNetworkSynchronizer=true')
    System.properties.findAll { name, ignored -> name.toString().startsWith('lumi.') }.each { name, value ->
        jvmArgs.add("-D${name}=${value}")
    }
    jvmArgs.add("-Dlumi.gametest.suite=${clientSuite}")
    jvmArgs.add("-Dlumi.gametest.game=${game}")
    def completion = clientDirectory.map { it.file('client.completed').asFile }
    jvmArgs.add(completion.map { "-Dlumi.gametest.completion=${it.absolutePath}" })
    jvmArgs.add(providers.provider { "-Dlumi.gametest.artifactHash=${evidence.hash(artifact.singleFile.toPath())}" })
    def record = [:]
    doFirst {
        if (!['ALL', 'SMOKE', 'UI', 'UI_SCALE', 'COMPARE_RENDER', 'INTERACTION', 'RECOVERY', 'EXACT', 'UPGRADE'].contains(clientSuite)) {
            throw new GradleException('Packaged client requires a functional GameTest suite')
        }
        if (clientSuite == 'UPGRADE' && (!['source', 'edit', 'verify', 'startup', 'resume'].contains(
                System.getProperty('lumi.gametest.upgrade.stage', ''))
                || System.getProperty('lumi.gametest.upgrade.fixture', '').isBlank())) {
            throw new GradleException('Packaged upgrade requires an explicit stage and fixture directory')
        }
        if (Boolean.getBoolean('lumi.benchmark.enabled') || Boolean.getBoolean('lumi.gametest.firstMinuteOnly')) {
            throw new GradleException('Packaged functional suites require full scenarios without benchmark mode')
        }
        new MinecraftArtifactVerifier().verify(artifact.singleFile.toPath(), target, candidateVersion)
        record.putAll([schema: 1, status: 'running', group: target.id(), game: game,
                scope: 'client-gametest', suite: clientSuite, javaVersion: target.javaVersion(),
                artifact: [path: artifact.singleFile.absolutePath, sha256: evidence.hash(artifact.singleFile.toPath())],
                mods: mods.files.collect { mod ->
                    if (!mod.isFile() || !mod.name.endsWith('.jar')) throw new GradleException("Non-JAR production mod: ${mod}")
                    [name: mod.name, sha256: evidence.hash(mod.toPath())]
                }])
        def output = clientManifest.get()
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
    }
    doLast {
        evidence.verifyClient(completion.get().toPath(), artifact.singleFile.toPath(), record.artifact.sha256, clientSuite)
        record.status = 'passed'
        clientManifest.get().text = JsonOutput.prettyPrint(JsonOutput.toJson(record)) + '\n'
        logger.lifecycle("Packaged client ${game}/${clientSuite}: passed; evidence: ${clientManifest.get()}")
    }
}

def vanillaTestJar = tasks.register('vanillaReopenGameTestJar', Jar) {
    from(sourceSets.gametest.output) {
        include 'io/github/lumi/vanillatest/**', 'vanilla-reopen.mod.json'
        rename 'vanilla-reopen.mod.json', 'fabric.mod.json'
    }
    archiveClassifier = target.javaVersion() == 21 ? 'vanilla-reopen-dev' : 'vanilla-reopen'
}
def vanillaProductionJar = vanillaTestJar
if (target.javaVersion() == 21) {
    vanillaProductionJar = tasks.register('remapVanillaReopenGameTestJar', lumiRemapJarTaskType) {
        inputFile = vanillaTestJar.flatMap { it.archiveFile }
        archiveClassifier = 'vanilla-reopen'
        addNestedDependencies = false
    }
}
def vanillaDirectory = layout.buildDirectory.dir("run/vanilla-reopen/${target.id()}/${game}/${UUID.randomUUID()}")
tasks.register('runVanillaReopenGameTest', lumiClientProductionRunTaskType) {
    group = 'verification'
    description = 'Opens a completed Restore without Lumi and compares it with an independent vanilla world'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.javaVersion()) }
    runDir = vanillaDirectory
    mods.setFrom(configurations.vanillaReopenMods, testApi, configurations.packagedClientGameTestApi, vanillaProductionJar)
    def fixture = System.getProperty('lumi.gametest.upgrade.fixture', '')
    jvmArgs.addAll('-Xmx2G', '-Dfabric.client.gametest', '-Dfabric.client.gametest.disableNetworkSynchronizer=true',
            "-Dlumi.gametest.upgrade.fixture=${fixture}")
    def completion = vanillaDirectory.map { it.file('vanilla.completed').asFile }
    jvmArgs.add(completion.map { "-Dlumi.gametest.completion=${it.absolutePath}" })
    doFirst {
        if (fixture.isBlank()) throw new GradleException('A completed upgrade fixture is required')
    }
    doLast {
        if (completion.get().text != game + '\nwithout-lumi') throw new GradleException('Vanilla reopen did not complete')
        logger.lifecycle("World reopened without Lumi on ${game}; evidence: ${completion.get()}")
    }
}
